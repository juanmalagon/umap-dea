[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "umap-dea"
version = "0.1.0"
description = "UMAP-based Dimensionality Reduction for Data Envelopment Analysis"
readme = "README.md"
license = {text = "LICENSE"}
authors = [
    {name = "Juan Malagon", email = "juanmalagon@gmail.com"},
]
requires-python = ">=3.9"
dependencies = [
    "dealib>=1.0.0",
    "numpy>=1.25.2",
    "pandas>=2.1.4",
    "scikit-learn>=1.3.2",
    "umap-learn>=0.5.5",
    "scipy>=1.11.0",
    "matplotlib>=3.8.2",
    "seaborn>=0.13.0",
    "mpl-tools>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]
jupyter = [
    "jupyter>=1.0.0",
    "ipykernel>=6.25.2",
    "ipywidgets>=8.1.1",
    "notebook>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/juanmalagon/umap-dea"
Repository = "https://github.com/juanmalagon/umap-dea.git"
Documentation = "https://github.com/juanmalagon/umap-dea/wiki"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --tb=short"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
